name: Feature request
description: Suggest an improvement to Screenroom.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the workflow or problem, including any current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you would expect the feature to work.
    validations:
      required: true
