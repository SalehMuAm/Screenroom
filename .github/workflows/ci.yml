name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/module-cache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Check scripts and app metadata
        run: |
          for script in scripts/*.sh scripts/tests/*.sh; do
            bash -n "$script"
          done
          plutil -lint Resources/Info.plist

      - name: Test install and release scripts
        run: ./scripts/tests/shell-regressions.sh

      - name: Run release tests
        run: xcrun swift test --configuration release --disable-sandbox

      - name: Build app bundle with an ad-hoc signature
        env:
          SIGNING_IDENTITY: "-"
        run: ./scripts/build-app.sh

      - name: Verify bundle and archive
        run: |
          codesign --verify --strict dist/Screenroom.app
          test "$(plutil -extract CFBundleIdentifier raw dist/Screenroom.app/Contents/Info.plist)" = "app.screenroom.Screenroom"
          test -x dist/Screenroom.app/Contents/MacOS/Screenroom
          ./scripts/package-release.sh
          cd dist
          shasum -a 256 -c Screenroom-*.zip.sha256
          unzip -t Screenroom-*.zip

      # CI validates packaging only and never publishes a download.
      # Release signing, notarization, and publication are maintainer steps.
